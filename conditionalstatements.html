<html>
<head>
    <title>Age Check</title>
    <script>
        function checkAge() {
            let age = document.getElementById("age").value; // Get the value from the input
            if (age >= 18) {
                document.getElementById("result").innerHTML = "You are an adult!";
            } else {
                document.getElementById("result").innerHTML = "You are a minor!";
            }
        }
    </script>
</head>
<body>
    <h2>Enter Your Age</h2>
    <input type="number" id="age" placeholder="Enter your age">
    <button onclick="checkAge()">Submit</button>
    <p id="result"></p>
</body>
</html>
