<html>
<head>
  <title>Encapsulation Example</title>
</head>
<body>

  <h2>Person Information</h2>
  
  <!-- Input fields for name and age -->
  <label for="name">Name:</label>
  <input type="text" id="name">
  <br><br>

  <label for="age">Age:</label>
  <input type="number" id="age">
  <br><br>

  <!-- Buttons to interact with the Person class -->
  <button onclick="updatePerson()">Update Person</button>
  <button onclick="displayPerson()">Display Person Info</button>
  
  <h3>Person Details:</h3>
  <p id="person-info"></p>

  <script>
    class Person {
      // Private properties using JavaScript's private class fields
      #name;
      #age;

      constructor(name, age) {
        this.#name = name;
        this.#age = age;
      }

      // Public method to get the name
      getName() {
        return this.#name;
      }

      // Public method to get the age
      getAge() {
        return this.#age;
      }

      // Public method to set the name
      setName(name) {
        this.#name = name;
      }

      // Public method to set the age
      setAge(age) {
        if (age >= 0) {
          this.#age = age;
        } else {
          console.log("Age cannot be negative.");
        }
      }
    }

    // Create a new person object
    let person = new Person("John", 30);

    // Function to update the person details from user input
    function updatePerson() {
      const name = document.getElementById("name").value;
      const age = parseInt(document.getElementById("age").value);

      if (name && age >= 0) {
        person.setName(name);
        person.setAge(age);
        alert("Person updated!");
      } else {
        alert("Please enter valid data.");
      }
    }

    // Function to display the person details
    function displayPerson() {
      const personInfo = `Name: ${person.getName()}<br>Age: ${person.getAge()}`;
      document.getElementById("person-info").innerHTML = personInfo;
    }

  </script>

</body>
</html>
